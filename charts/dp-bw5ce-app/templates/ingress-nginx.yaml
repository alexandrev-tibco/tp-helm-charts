{{- /* Render only when using NGF/Gateway API instead of classic NGINX Ingress */ -}}
{{- if and .Values.ingress.enabled (eq .Values.ingress.controllerName "nginx-gateway-fabric") -}}
{{- $dot := . -}}
{{- $gwName := default "public" .Values.gateway.name -}}
{{- $gwNs := .Values.gateway.namespace -}}

{{- range $rule := .Values.ingress.rules -}}
{{- range $path := $rule.paths }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Name aligns with previous Ingress naming (per service port)
  name: {{ include "dp-bw5ce-app.fullname" $dot }}-{{ $path.port }}
  labels:
    {{- include "dp-bw5ce-app.labels" $dot | nindent 4 }}
    platform.tibco.com/service-discoverable: {{ $path.serviceDiscoverable | quote }}
  {{- if $path.serviceDiscoverable }}
  annotations:
    # Optional service description metadata (moved from Ingress annotation)
    platform.tibco.com/service-description: {{ $path.serviceDescription | squote }}
  {{- end }}
spec:
  # Attach to your Gateway (HTTPS section recommended)
  parentRefs:
    - name: {{ $gwName }}
      sectionName: https
      {{- if $gwNs }}
      namespace: {{ $gwNs }}
      {{- end }}

  # Hostname from the rule (same behavior as Ingress .rules.host)
  hostnames:
    - {{ $rule.host | quote }}

  rules:
    - matches:
        # Keep PathPrefix semantics. For "/" we still match "/" (captures the rest).
        - path:
            type: PathPrefix
            value: {{ $path.path | quote }}

      # Replicate NGINX Ingress rewrite-target behavior:
      # - When original path was "/" and rewrite-target "/$1",
      #   ReplacePrefixMatch "/" keeps the rest of the URL path.
      # - When original path was "<prefix>(/|$)(.*)" and rewrite-target "/$2",
      #   ReplacePrefixMatch "/" strips "<prefix>" and forwards the remainder.
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

        # Preserve X-Forwarded-Prefix like the original Ingress annotation
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Prefix
                value: {{ $path.path | quote }}

      # Backend service and port are identical to the Ingress spec
      backendRefs:
        - name: {{ include "dp-bw5ce-app.fullname" $dot }}
          port: {{ $path.port }}
{{- end }}
{{- end }}
{{- end }}