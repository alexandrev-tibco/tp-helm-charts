{{- if .Values.ingress.enabled -}}
{{- $fullName := include "artifactmanager.fullname" . -}}
{{- $gatewayName := printf "tibco-dp-%s" .Values.global.cp.dataplaneId -}}
{{- with (dig "gateway" "parentGatewayName" "" .Values.ingress) }}
  {{- $gatewayName = tpl . $ }}
{{- end }}
{{- $parentNamespace := .Release.Namespace -}}
{{- with (dig "gateway" "parentGatewayNamespace" "" .Values.ingress) }}
  {{- $parentNamespace = tpl . $ }}
{{- end }}
{{- $listenerName := "http" -}}
{{- with (dig "gateway" "listenerName" "" .Values.ingress) }}
  {{- $listenerName = tpl . $ }}
{{- end }}
{{- range $index, $host := (default (list (dict)) .Values.ingress.hosts) }}
{{- if gt $index 0 }}
---
{{- end }}
{{- $resolvedHost := "" }}
{{- if $host.host }}
  {{- $resolvedHost = tpl $host.host $ }}
{{- else }}
  {{- $resolvedHost = printf "dp-%s.platform.local" $.Values.global.cp.dataplaneId }}
{{- end }}
{{- $routeName := printf "%s-%d" $fullName (add $index 1) }}
{{- if $resolvedHost }}
  {{- $hostToken := regexReplaceAll "[^a-z0-9-]" (lower $resolvedHost) "-" }}
  {{- if $hostToken }}
    {{- $routeName = printf "%s-%s" $fullName (trimSuffix "-" $hostToken) }}
  {{- end }}
{{- end }}
{{- $routeName = trunc 63 (trimSuffix "-" $routeName) }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "artifactmanager.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-namespace: {{ .Values.global.cp.resources.serviceaccount.namespace }}
    meta.helm.sh/release-name: {{ $fullName }}
    {{- with .Values.ingress.annotations }}
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $parentNamespace }}
      sectionName: {{ $listenerName }}
{{- if $resolvedHost }}
  hostnames:
    - {{ $resolvedHost | quote }}
{{- end }}
  rules:
{{- if $.Values.ingress.hostsOverride }}
{{- range $path := (default (list) $host.paths) }}
{{- $pathValue := default "/" $path.path }}
{{- $pathValue = tpl $pathValue $ }}
{{- $pathType := default "Prefix" $path.pathType }}
{{- $matchType := "PathPrefix" }}
{{- $lowerType := lower $pathType }}
{{- if eq $lowerType "exact" }}
  {{- $matchType = "Exact" }}
{{- else if eq $lowerType "regex" }}
  {{- $matchType = "RegularExpression" }}
{{- end }}
    - matches:
        - path:
            type: {{ $matchType }}
            value: {{ $pathValue }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /tibco/agent/integration/{{ $.Values.global.cp.instanceId }}/artifactmanager/
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}
{{- end }}
