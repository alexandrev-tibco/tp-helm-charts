{{- if .Values.ingress.enabled -}}
{{- $fullName := include "o11y-service.fullname" . -}}
{{- $gatewayName := printf "tibco-dp-%s" .Values.global.cp.dataplaneId -}}
{{- with (dig "gateway" "parentGatewayName" "" .Values.ingress) }}
  {{- $gatewayName = tpl . $ }}
{{- end }}
{{- $parentNamespace := .Release.Namespace -}}
{{- with (dig "gateway" "parentGatewayNamespace" "" .Values.ingress) }}
  {{- $parentNamespace = tpl . $ }}
{{- end }}
{{- $listenerName := "http" -}}
{{- with (dig "gateway" "listenerName" "" .Values.ingress) }}
  {{- $listenerName = tpl . $ }}
{{- end }}
{{- range $index, $host := (default (list (dict)) .Values.ingress.hosts) }}
{{- if gt $index 0 }}
---
{{- end }}
{{- $resolvedHost := "" }}
{{- if $host.host }}
  {{- $resolvedHost = tpl $host.host $ }}
{{- else }}
  {{- $resolvedHost = printf "dp-%s.platform.local" $.Values.global.cp.dataplaneId }}
{{- end }}
{{- $routeName := printf "%s-prom-%d" $fullName (add $index 1) }}
{{- if $resolvedHost }}
  {{- $hostToken := regexReplaceAll "[^a-z0-9-]" (lower $resolvedHost) "-" }}
  {{- if $hostToken }}
    {{- $routeName = printf "%s-%s" $fullName (trimSuffix "-" $hostToken) }}
  {{- end }}
{{- end }}
{{- $routeName = trunc 63 (trimSuffix "-" $routeName) }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "o11y-service.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-namespace: {{ .Values.global.cp.resources.serviceaccount.namespace }}
    meta.helm.sh/release-name: {{ include "o11y-service.fullname" . }}
    haproxy.org/cors-enable: "true"
    haproxy.org/load-balance: leastconn
    haproxy.org/src-ip-header: X-Real-IP
    ingress.kubernetes.io/path-rewrite: /tibco/agent/o11y/{{ .Values.global.cp.dataplaneId }}/otlp/exporter/metrics/(.*) /\1
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $parentNamespace }}
      sectionName: {{ $listenerName }}
{{- if $resolvedHost }}
  hostnames:
    - {{ $resolvedHost | quote }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tibco/agent/o11y/{{ $.Values.global.cp.dataplaneId }}/otlp/exporter/metrics/
      backendRefs:
        - name: otel-userapp-metrics
          port: 4320
{{- end }}
{{- end -}}
