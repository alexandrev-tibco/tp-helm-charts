{{- /* Solo renderiza si queremos usar Gateway API en lugar de Ingress */ -}}
{{- if eq .Values.publicApi.ingress.controllerName "nginx" }}
{{- $fullName := include "bw5provisioner.fullname" . -}}

# HTTPRoute principal (apunta al Gateway en HTTPS)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-public
    app.kubernetes.io/name: {{ $fullName }}
spec:
  parentRefs:
    - name: {{ default .Values.publicApi.ingress.config.className .Values.gateway.name }}
      sectionName: https  
      {{- if .Values.gateway.namespace }}
      namespace: {{ .Values.gateway.namespace }}
      {{- end }}
  hostnames:
    - {{ .Values.publicApi.ingress.config.fqdn }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.publicApi.ingress.config.pathPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Prefix
                value: {{ .Values.publicApi.ingress.config.pathPrefix }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $.Values.publicApiService.targetPort }}
{{- end }}